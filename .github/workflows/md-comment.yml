name: PR MD Comment

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  md-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post MD file as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Source MD file — change path if you want a different doc
          MD_FILE="docs/BATCH_C_PLAN.md"
          if [ ! -f "$MD_FILE" ]; then
            echo "⚠️ $MD_FILE not found, skipping comment"
            exit 0
          fi
          # GitHub comment body limit is 65536 chars — truncate if needed
          MAX=60000
          BODY=$(head -c $MAX "$MD_FILE")
          if [ ${#BODY} -ge $MAX ]; then
            BODY="$BODY

          ... (truncated, see $MD_FILE)"
          fi
          # Upsert: update existing bot comment or create a new one
          MARKER="<!-- md-comment: $MD_FILE -->"
          BODY_WITH_MARKER="$MARKER
          $BODY"
          # Find existing comment with marker
          EXISTING=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments --paginate --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Updating existing comment $EXISTING"
            gh api repos/${{ github.repository }}/issues/comments/$EXISTING -X PATCH -f body="$BODY_WITH_MARKER" > /dev/null
          else
            echo "Creating new comment from $MD_FILE"
            gh pr comment $PR_NUMBER --body-file <(echo "$BODY_WITH_MARKER") 2>&1
          fi
